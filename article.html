<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>News Article | Samrat Chakraborty</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="inner.css"></head><body>
<header class="topbar"><a class="brand" href="index.html"><span class="brand-logo"><img src="https://upload.wikimedia.org/wikipedia/commons/7/78/Logo_of_the_Bharatiya_Janata_Party.svg" alt=""></span><span><b>Samrat Chakraborty</b><small>Official Website</small></span></a><nav style="display:flex"><a href="index.html">Home</a><a href="news.html">News</a><a href="media.html">Media</a><a href="admin.html">Admin</a></nav></header>
<main class="inner"><article id="article" class="article container"><div class="loading">Loading article…</div></article></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>const sb=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY),id=new URLSearchParams(location.search).get("id"),box=document.querySelector("#article"),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));(async()=>{const {data}=await sb.from("news").select("*").eq("id",id).eq("published",true).single();if(!data){box.innerHTML='<div class="loading">Article not found.</div>';return}box.innerHTML=`<p class="kicker">${esc(data.category||"NEWS")}</p><h1>${esc(data.title)}</h1><p class="article-meta">${new Date(data.published_at||data.created_at).toLocaleString()}</p>${data.featured_image_url?`<img class="article-img" src="${esc(data.featured_image_url)}">`:""}<div class="article-body">${data.content||""}</div>`})()</script></body></html>
